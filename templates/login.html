<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SENAI - Login</title>
    <style>
        :root {
            --senai-blue: #7ac5ff;
            --senai-red: #0d02aa;
            --light-gray: #f4f4f4;
            --dark-gray: #333;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--light-gray);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-card {
            background-color: #ffffff;
            padding: 2.5rem;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 380px;
            border-top: 6px solid var(--senai-blue);
        }

        .header-brand {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header-brand .logo {
            font-size: 28px;
            font-weight: 900;
            color: var(--senai-blue);
            letter-spacing: -1px;
        }

        h2 {
            font-size: 1.2rem;
            color: var(--dark-gray);
            margin-bottom: 1.5rem;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #666;
            font-size: 0.9rem;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--senai-blue);
            box-shadow: 0 0 5px rgba(138, 177, 248, 0.2);
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background-color: var(--senai-blue);
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: background 0.3s;
            margin-top: 0.5rem;
        }

        .btn-login:hover {
            background-color: #5153c2;
        }

        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1.5rem;
            font-size: 0.85rem;
        }

        .options a {
            color: var(--senai-blue);
            text-decoration: none;
            transition: color 0.2s;
        }

        .options a:hover {
            color: var(--senai-red);
            text-decoration: underline;
        }

        .divider {
            height: 1px;
            background-color: #eee;
            margin: 1.5rem 0;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="header-brand">
            <div class="logo">SENAI</div>
        </div>

        <h2>Acesso ao Sistema</h2>

        <form action="/login" method="post">
            <div class="form-group">
                <label for="email">E-mail Corporativo</label>
                <input type="email" id="email" name="email" placeholder="seu@email.com" required>
            </div>

            <div class="form-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>
            </div>

            <button type="submit" class="btn-login">Entrar</button>
        </form>
        
        <div class="divider"></div>

        <div class="options">
            <a href="/cadastro">Criar nova conta</a>
            <a href="#">Esqueci a senha</a>
        </div>
    </div>

</body>
</html>
