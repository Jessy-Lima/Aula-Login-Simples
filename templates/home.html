<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal SENAI - Início</title>
    <style>
        /* Reset básico e fontes */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f4f4;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
        }

        /* Cabeçalho inspirado no padrão SENAI */
        header {
            background-color: #004a94; /* Azul SENAI */
            width: 100%;
            padding: 20px 0;
            text-align: center;
            border-bottom: 5px solid #ed1c24; /* Linha Vermelha SENAI */
            margin-bottom: 50px;
        }

        header h1 {
            color: white;
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Container principal */
        .container {
            background-color: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        h2 {
            color: #333;
            margin-bottom: 30px;
        }

        /* Estilização dos Links/Botões */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            text-decoration: none;
            padding: 12px;
            border-radius: 5px;
            font-weight: bold;
            transition: 0.3s;
            text-transform: uppercase;
        }

        .btn-login {
            background-color: #004a94;
            color: white;
            border: 1px solid #004a94;
        }

        .btn-login:hover {
            background-color: #003366;
        }

        .btn-cadastro {
            background-color: transparent;
            color: #004a94;
            border: 2px solid #004a94;
        }

        .btn-cadastro:hover {
            background-color: #004a94;
            color: white;
        }

        footer {
            margin-top: auto;
            padding-bottom: 20px;
            color: #777;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <header>
        <h1>SENAI</h1>
    </header>

    <div class="container">
        <h2>Bem-vindo ao Portal</h2>
        <p style="margin-bottom: 25px; color: #666;">Escolha uma opção para continuar seu acesso.</p>
        
        <div class="btn-group">
            <a href="/login" class="btn btn-login">Fazer Login</a>
            <a href="/cadastro" class="btn btn-cadastro">Criar Conta</a>
        </div>
    </div>

    <footer>
        &copy; 2026 Serviço Nacional de Aprendizagem Industrial
    </footer>

</body>
</html>
