<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SENAI - Cadastro de Usuário</title>
    <style>
        :root {
            --senai-blue: #7ac5ff;
            --senai-red: #2e14a0;
            --light-gray: #f4f4f4;
            --dark-gray: #333;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--light-gray);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: #ffffff;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            border-top: 6px solid var(--senai-blue);
        }

        .logo-placeholder {
            text-align: center;
            margin-bottom: 1.5rem;
            font-weight: bold;
            font-size: 24px;
            color: var(--senai-blue);
        }

        h1 {
            font-size: 1.5rem;
            color: var(--dark-gray);
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #555;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box; /* Garante que o padding não estoure a largura */
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: var(--senai-blue);
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--senai-blue);
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 1rem;
        }

        button:hover {
            background-color: #00457a;
        }

        .footer-links {
            text-align: center;
            margin-top: 1.5rem;
        }

        .footer-links a {
            color: var(--senai-blue);
            text-decoration: none;
            font-size: 0.9rem;
        }

        .footer-links a:hover {
            text-decoration: underline;
            color: var(--senai-red);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-placeholder">
            SENAI
        </div>

        <h1>Criar Conta</h1>

        <form action="/cadastro" method="post">
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="exemplo@senai.br" required>
            </div>

            <div class="form-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>
            </div>

            <button type="submit">CADASTRAR</button>
        </form>
        
        <div class="footer-links">
            <a href="/login">Já tenho conta? Entrar</a>
        </div>
    </div>

</body>
</html>
